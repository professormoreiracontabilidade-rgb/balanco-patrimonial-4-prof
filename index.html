<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 4 — Modo Professor Moreira</title><style>
:root{--navy:#17133b;--purple:#5730a0;--gold:#ffce42}*{box-sizing:border-box}body{margin:0;background:#eae6f5;color:#181629;font-family:Arial,sans-serif}.top{background:var(--navy);color:white;padding:15px;text-align:center;border-bottom:5px solid var(--gold)}.top strong{font-size:clamp(18px,3vw,27px)}.top small{display:block;margin-top:6px;font-size:15px}.wrap{max-width:1250px;margin:auto;padding:18px 20px 210px}.badge{display:inline-block;background:#e1d8fa;color:#351675;border-radius:25px;padding:9px 15px;font-weight:bold}.source{margin:16px 0;color:#574b76;font-weight:bold}.question{font-size:clamp(21px,2.4vw,32px);white-space:pre-line;line-height:1.43;background:white;border:2px solid #b9a6dd;border-radius:16px;padding:25px}.options{display:grid;gap:12px;margin:20px 0}.option{display:block;width:100%;padding:16px 20px;text-align:left;background:white;border:2px solid #b7a6d8;border-radius:14px;font-size:clamp(19px,2vw,26px);cursor:pointer}.option.selected{background:#e7ddff;border-color:#5a31a4}.letter{display:inline-block;background:#302064;color:white;border-radius:50%;min-width:36px;text-align:center;padding:6px;margin-right:12px}.answer{display:none;background:#fff6d9;border:2px solid #e4b832;border-radius:14px;padding:20px;margin:18px 0;font-size:clamp(19px,2vw,25px);line-height:1.4}.answer.visible{display:block}.toolbar{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#211849;color:white;padding:9px 12px 12px;box-shadow:0 -5px 25px #0004}.toolbar-inner{max-width:1250px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}.toolbar button,.toolbar select{border:0;border-radius:9px;padding:10px 13px;font-size:16px;font-weight:bold;cursor:pointer;background:#fff;color:#24174a}.toolbar button.primary{background:var(--gold)}.toolbar button.active{background:#a8f1c3}.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px}.toolbar input[type=range]{width:85px}.swatch{width:32px;height:32px;border:3px solid white!important;border-radius:50%!important;padding:0!important}.swatch.active{outline:3px solid var(--gold)}#ink{position:fixed;inset:0;width:100vw;height:100vh;z-index:20;pointer-events:none;touch-action:auto}.mode-pen #ink{pointer-events:auto;touch-action:none;cursor:crosshair}.mode-erase #ink{pointer-events:auto;touch-action:none;cursor:cell}.hint{font-size:13px;color:#dcd4f4;text-align:center;margin-top:6px}@media(max-width:650px){.wrap{padding:12px 12px 235px}.question{padding:16px}.toolbar button{font-size:14px;padding:9px}.swatch{width:27px;height:27px}}
</style></head><body><div class="top"><strong>CURSO DE CONTABILIDADE PROFESSOR MOREIRA</strong><small>BALANÇO PATRIMONIAL • QUIZ Nº 3 • MODO PROFESSOR</small></div><main class="wrap"><div id="counter" class="badge">QUESTÃO 1 DE 10</div><div class="source">QUESTÃO INÉDITA • PADRÃO FGV</div><div id="question" class="question"></div><div id="options" class="options"></div><div id="answer" class="answer"></div></main><canvas id="ink" aria-label="Área de escrita"></canvas><footer class="toolbar"><div class="toolbar-inner"><button id="prev" class="primary">⬅ VOLTAR</button><button id="next" class="primary">SEGUIR ➡</button><button id="restart">↻ REINICIAR</button><button id="key">✓ GABARITO</button><button id="navigate" class="active">☝ NAVEGAR</button><button id="pen">✎ CANETA</button><button id="marker">▰ MARCA-TEXTO</button><button id="eraser">⌫ BORRACHA</button><button class="swatch active" data-color="#d92020" style="background:#d92020" aria-label="Vermelho"></button><button class="swatch" data-color="#1766db" style="background:#1766db" aria-label="Azul"></button><button class="swatch" data-color="#111111" style="background:#111111" aria-label="Preto"></button><button class="swatch" data-color="#15934e" style="background:#15934e" aria-label="Verde"></button><button class="swatch" data-color="#f0cd1d" style="background:#f0cd1d" aria-label="Amarelo"></button><label>Espessura <input id="width" type="range" min="2" max="24" value="4"></label><button id="clear">LIMPAR TINTA</button></div><div class="hint">Para escrever, selecione CANETA ou MARCA-TEXTO. Para usar as setas e alternativas, selecione NAVEGAR.</div></footer><script>
const Q=[
{q:'Em relação à estrutura do Balanço Patrimonial, assinale a afirmativa correta.',o:['O ativo representa as origens de recursos.','O passivo representa as aplicações de recursos.','O ativo representa as aplicações de recursos.','O patrimônio líquido representa apenas obrigações com terceiros.'],a:2,c:'O ativo evidencia onde os recursos foram aplicados. O passivo e o Patrimônio Líquido representam as origens desses recursos.'},
{q:'Uma entidade mantém recursos em uma conta bancária que pode ser movimentada imediatamente e sem restrições.\n\nNo Balanço Patrimonial, esses recursos são classificados como:',o:['Disponibilidades no ativo circulante.','Investimentos no ativo não circulante.','Contas a receber no ativo circulante.','Aplicações no realizável a longo prazo.'],a:0,c:'Recursos bancários disponíveis para utilização imediata fazem parte das disponibilidades, classificadas no ativo circulante.'},
{q:'Uma sociedade empresária adquiriu uma licença de software que será utilizada durante quatro anos em suas operações.\n\nA licença deve ser classificada no:',o:['Ativo imobilizado.','Ativo intangível.','Ativo circulante.','Patrimônio líquido.'],a:1,c:'A licença é um ativo identificável sem substância física, controlado pela entidade e capaz de gerar benefícios econômicos. Portanto, integra o intangível.'},
{q:'Em 31/12/2025, uma entidade possuía salários de dezembro no valor de R$ 40.000, que seriam pagos aos empregados em janeiro de 2026.\n\nNo Balanço Patrimonial de 31/12/2025, o valor deve ser classificado no:',o:['Ativo circulante.','Passivo circulante.','Passivo não circulante.','Patrimônio líquido.'],a:1,c:'Os salários já foram incorridos e representam uma obrigação a ser paga no curto prazo. Dessa forma, são classificados no passivo circulante.'},
{q:'Assinale a opção que apresenta uma conta que pode ser classificada no ativo circulante ou no ativo realizável a longo prazo, dependendo do prazo de recebimento.',o:['Capital social.','Depreciação acumulada.','Duplicatas a receber.','Reserva de capital.'],a:2,c:'As duplicatas a receber serão classificadas no circulante ou no realizável a longo prazo conforme o prazo esperado de recebimento.'},
{q:'Uma sociedade empresária realizou uma aplicação financeira com vencimento previsto para 36 meses após a data da contratação.\n\nNo Balanço Patrimonial, essa aplicação deve ser classificada, em regra, no:',o:['Ativo circulante.','Ativo realizável a longo prazo.','Passivo não circulante.','Patrimônio líquido.'],a:1,c:'Como a aplicação será realizada em prazo superior a doze meses e após o exercício seguinte, deve ser classificada no ativo realizável a longo prazo.'},
{q:'O Patrimônio Líquido de uma sociedade empresária corresponde:',o:['Ao total das obrigações exigíveis da entidade.','À diferença entre o ativo e o passivo.','À soma do ativo circulante e do passivo circulante.','Ao total dos bens corpóreos pertencentes à entidade.'],a:1,c:'O Patrimônio Líquido representa o interesse residual nos ativos após a dedução de todos os passivos. Assim: Patrimônio Líquido = Ativo − Passivo.'},
{q:'Em 31/12/2025, uma sociedade empresária apresentava:\n\n• Ativo circulante: R$ 150.000;\n• Ativo não circulante: R$ 350.000;\n• Passivo circulante: R$ 100.000;\n• Passivo não circulante: R$ 180.000.\n\nO valor do Patrimônio Líquido era de:',o:['R$ 180.000.','R$ 220.000.','R$ 280.000.','R$ 500.000.'],a:1,c:'O ativo total é R$ 500.000 e o passivo total é R$ 280.000. Logo, o Patrimônio Líquido é R$ 500.000 − R$ 280.000 = R$ 220.000.'},
{q:'Em relação à apresentação das contas no Balanço Patrimonial, assinale a afirmativa correta.',o:['As contas do ativo são apresentadas em ordem crescente de liquidez.','As contas do passivo são apresentadas exclusivamente pelo valor monetário.','As contas do ativo são apresentadas em ordem decrescente de liquidez.','As contas do Patrimônio Líquido são classificadas conforme o prazo de vencimento.'],a:2,c:'De acordo com a Lei nº 6.404/1976, as contas do ativo são apresentadas em ordem decrescente de grau de liquidez.'},
{q:'Uma sociedade empresária possuía ativo total de R$ 700.000 e Patrimônio Líquido de R$ 260.000.\n\nO total das obrigações com terceiros era de:',o:['R$ 260.000.','R$ 440.000.','R$ 700.000.','R$ 960.000.'],a:1,c:'Pela equação Ativo = Passivo + Patrimônio Líquido, temos: Passivo = R$ 700.000 − R$ 260.000 = R$ 440.000.'}
];
const $=id=>document.getElementById(id);let current=0,mode='navigate',color='#d92020',size=4,selected={},visible={},drawings={};const canvas=$('ink'),ctx=canvas.getContext('2d');let drawing=false,last=null;
function resize(){const old=canvas.width?canvas.toDataURL():null;canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,innerWidth,innerHeight);im.src=old}}window.addEventListener('resize',()=>{save();resize();load()});
function save(){drawings[current]=canvas.toDataURL()}function load(){ctx.clearRect(0,0,innerWidth,innerHeight);if(drawings[current]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,innerWidth,innerHeight);im.src=drawings[current]}}
function render(){const x=Q[current];$('counter').textContent=`QUESTÃO ${current+1} DE ${Q.length}`;$('question').textContent=x.q;$('options').replaceChildren();x.o.forEach((t,j)=>{const b=document.createElement('button');b.className='option'+(selected[current]===j?' selected':'');const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);b.append(letter,document.createTextNode(t));b.onclick=()=>{selected[current]=j;render()};$('options').append(b)});$('answer').textContent=`GABARITO: ${String.fromCharCode(65+x.a)} — ${x.o[x.a]}\n\n${x.c}`;$('answer').style.whiteSpace='pre-line';$('answer').classList.toggle('visible',!!visible[current]);$('prev').disabled=current===0;$('next').disabled=current===Q.length-1;window.scrollTo(0,0);load()}
function go(n){if(n<0||n>=Q.length)return;save();current=n;render()}$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('restart').onclick=()=>{save();current=0;render()};$('key').onclick=()=>{visible[current]=!visible[current];$('answer').classList.toggle('visible',!!visible[current])};
function setMode(m){mode=m;document.body.classList.remove('mode-pen','mode-erase');if(m!=='navigate')document.body.classList.add(m==='eraser'?'mode-erase':'mode-pen');['navigate','pen','marker','eraser'].forEach(id=>$(id).classList.toggle('active',id===m))}['navigate','pen','marker','eraser'].forEach(id=>$(id).onclick=()=>setMode(id));document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b));setMode('pen')});$('width').oninput=e=>size=+e.target.value;$('clear').onclick=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);save()};
function pos(e){return{x:e.clientX,y:e.clientY}}canvas.addEventListener('pointerdown',e=>{if(mode==='navigate')return;drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.01,last.y+.01);ctx.lineWidth=mode==='marker'?size*2.5:mode==='eraser'?size*3:size;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';ctx.globalAlpha=mode==='marker'?.3:1;ctx.strokeStyle=mode==='marker'?(color==='#d92020'?'#f0cd1d':color):color;ctx.stroke();e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()});function end(){if(drawing){drawing=false;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';save()}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);resize();render();setMode('navigate');
</script></body></html>
